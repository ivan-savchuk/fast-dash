<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastDash</title>
    <!--
      react-draggable (which react-grid-layout uses for dragging and resizing)
      has a debug helper that reads `process.env.DRAGGABLE_DEBUG`. A browser has
      no `process`, so that line throws on the first mousedown and silently
      kills every drag and resize. This stub makes the read return undefined.
      It must run before any module loads, which is why it lives here.
    -->
    <script>
      window.process = window.process || { env: {} }
    </script>
    <!--
      Apply the saved (or OS) theme before first paint, so a dark-mode user does
      not get a flash of the light UI while React mounts. App keeps it in sync
      afterwards.
    -->
    <script>
      try {
        var t = localStorage.getItem('fastdash:theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
